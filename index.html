<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Placement Cell — view placement opportunities, upcoming drives, and announcements." />
    <title>Placement Cell | Your College Name</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('placement-cell-theme')
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
